services:
  postgres:
    image: postgres:16-alpine
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
    ports:
      - '5544:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    container_name: backstage-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://backstage:backstage@postgres:5432/backstage
      NODE_ENV: development
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backstage-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://backstage:backstage@postgres:5432/backstage
      JWT_SECRET: local-development-secret-change-before-production
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports:
      - '4000:4000'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backstage-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_LOCAL_API_TARGET: http://backend:4000
    ports:
      - '3000:4173'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
