name: Validate and Deploy BACKSTAGE to Vercel

on:
  push:
    branches: [main, codex/platform-stabilization, backstage-3.1.0-final]
  pull_request:
    branches: [main, codex/platform-stabilization, backstage-3.1.0-final]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: backstage
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-postgres-test
          POSTGRES_DB: backstage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backstage -d backstage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-postgres-test
      DATABASE_URL: postgresql://backstage:ci-${{ github.run_id }}-postgres-test@localhost:5432/backstage_ci
      JWT_SECRET: ci-only-${{ github.run_id }}-test-validation-key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install probability engine dependencies
        run: python -m pip install -r probability/requirements.txt

      - name: Run probability math tests
        working-directory: probability
        run: python -m unittest -v test_statistical_engine

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Ensure CI database exists
        working-directory: backend
        run: npm run db:ensure

      - name: Apply all database migrations
        working-directory: backend
        run: npx node-pg-migrate up

      - name: Verify critical tables
        run: |
          tables_present=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5432 -U backstage -d backstage_ci -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*) = 3 FROM unnest(ARRAY['public.analysis_run_candidates', 'public.operational_events', 'public.command_executions']) AS required(table_name) WHERE to_regclass(table_name) IS NOT NULL;")
          test "$tables_present" = "t"

      - name: Create isolated smoke-test organization
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5432 -U backstage -d backstage_ci -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (name, slug, status) VALUES ('BACKSTAGE CI', 'backstage-ci', 'active'); INSERT INTO roles (name, description) VALUES ('viewer', 'Read-only CI smoke role') ON CONFLICT (name) DO NOTHING;"

      - name: Smoke test backend health and authenticated spatial API
        run: |
          node backend/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          healthy=false
          for i in {1..30}; do
            if curl --fail --silent http://localhost:4000/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          fi
          registration=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-smoke-${GITHUB_RUN_ID}@example.test\",\"password\":\"ci-smoke-password\",\"organization_slug\":\"backstage-ci\"}" \
            http://localhost:4000/auth/register)
          token=$(printf '%s' "$registration" | jq -er '.token')
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            http://localhost:4000/auth/me | jq -e '.organization_id != null and .role == "viewer"'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"geometry":{"type":"Point","coordinates":[0,0]}}' \
            http://localhost:4000/spatial/measure | jq -e 'type == "object"'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply production database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:up

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify Vercel production health
        env:
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
        run: |
          test -n "$VERCEL_PRODUCTION_URL"
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.VERCEL_PRODUCTION_URL}/api/health`);
          if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
          const health = await response.json();
          if (health.status !== 'ok' || health.postgres !== 'healthy'
            || health.mongodb !== 'healthy' || health.spatialStore !== 'atlas') {
            throw new Error('Production requires PostgreSQL and Atlas to be healthy with SPATIAL_STORE=atlas.');
          }
          NODE
