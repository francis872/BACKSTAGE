name: Validate and Deploy BACKSTAGE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://backstage:backstage@localhost:5432/backstage_ci
      JWT_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL
        run: |
          docker run -d --name backstage-postgres \
            -e POSTGRES_USER=backstage \
            -e POSTGRES_PASSWORD=backstage \
            -e POSTGRES_DB=backstage_ci \
            -p 5432:5432 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec backstage-postgres pg_isready -U backstage -d backstage_ci; then
              exit 0
            fi
            sleep 2
          done
          docker logs backstage-postgres
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Apply all database migrations
        working-directory: backend
        run: npx node-pg-migrate up

      - name: Verify critical tables
        run: |
          tables_present=$(docker exec backstage-postgres psql -U backstage -d backstage_ci -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*) = 3 FROM unnest(ARRAY['public.analysis_run_candidates', 'public.operational_events', 'public.command_executions']) AS required(table_name) WHERE to_regclass(table_name) IS NOT NULL;")
          test "$tables_present" = "t"

      - name: Create isolated smoke-test organization
        run: |
          docker exec backstage-postgres psql -U backstage -d backstage_ci -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (name, slug, status) VALUES ('BACKSTAGE CI', 'backstage-ci', 'active'); INSERT INTO roles (name, description) VALUES ('viewer', 'Read-only CI smoke role') ON CONFLICT (name) DO NOTHING;"

      - name: Smoke test backend health
        run: |
          node backend/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          healthy=false
          for i in {1..30}; do
            if curl --fail --silent http://localhost:4000/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          fi
          registration=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-smoke-${GITHUB_RUN_ID}@example.test\",\"password\":\"ci-smoke-password\",\"organization_slug\":\"backstage-ci\"}" \
            http://localhost:4000/auth/register)
          token=$(printf '%s' "$registration" | jq -er '.token')
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            http://localhost:4000/auth/me | jq -e '.organization_id != null and .role == "viewer"'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"geometry":{"type":"Point","coordinates":[0,0]}}' \
            http://localhost:4000/spatial/measure | jq -e 'type == "object"'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply Railway database migrations
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway exec npx node-pg-migrate up

      - name: Deploy backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Verify Railway service
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service list
