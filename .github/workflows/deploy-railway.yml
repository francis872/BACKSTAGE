name: Validate and Deploy BACKSTAGE

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://backstage:backstage@localhost:5432/backstage_ci
      JWT_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL with PostGIS
        run: |
          docker run -d --name backstage-postgis             -e POSTGRES_USER=backstage             -e POSTGRES_PASSWORD=backstage             -e POSTGRES_DB=backstage_ci             -p 5432:5432             postgis/postgis:16-3.4

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec backstage-postgis pg_isready -U backstage -d backstage_ci; then
              exit 0
            fi
            sleep 2
          done
          docker logs backstage-postgis
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Apply all database migrations
        working-directory: backend
        run: npx node-pg-migrate up

      - name: Verify critical tables
        run: |
          docker exec backstage-postgis psql -U backstage -d backstage_ci -c "\dt"
          docker exec backstage-postgis psql -U backstage -d backstage_ci -c "SELECT to_regclass('public.analysis_run_candidates'), to_regclass('public.operational_events'), to_regclass('public.command_executions');"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply Railway database migrations
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway exec npx node-pg-migrate up

      - name: Deploy backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Verify Railway service
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service list
