services:
  - type: web
    name: backstage-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPATIAL_STORE
        value: atlas
      - key: JWT_ISSUER
        value: backstage
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
