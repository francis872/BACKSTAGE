services:
  - type: web
    name: backstage-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: service
      - key: PORT
        value: 4000

  - type: pserv
    name: backstage-postgres
    plan: free
    ipAllowList: []
    postgreSQL:
      version: 14
